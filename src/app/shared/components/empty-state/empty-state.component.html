<div class="flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-slate-200 bg-slate-50/60 px-6 py-12 text-center">
  <app-icon [nombre]="icono()" clase="h-10 w-10 text-slate-300" />
  <h3 class="text-base font-semibold text-slate-700">{{ titulo() }}</h3>
  @if (mensaje()) {
    <p class="max-w-sm text-sm text-slate-500">{{ mensaje() }}</p>
  }
</div>
