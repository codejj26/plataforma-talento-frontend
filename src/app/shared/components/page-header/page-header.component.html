<header class="mb-8">
  <div class="flex items-center gap-3">
    @if (icono()) {
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-brand-50 text-brand-700 ring-1 ring-brand-100">
        <app-icon [nombre]="icono()" clase="h-6 w-6" />
      </div>
    }
    <div>
      <h1 class="text-2xl font-bold tracking-tight">{{ titulo() }}</h1>
      @if (descripcion()) {
        <p class="mt-1 text-sm text-slate-500">{{ descripcion() }}</p>
      }
    </div>
  </div>
</header>
