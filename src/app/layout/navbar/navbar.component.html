<header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur">
  <div class="contenedor flex h-16 items-center justify-between gap-4">
    <!-- Marca -->
    <a routerLink="/inicio" class="flex items-center gap-2.5">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-700 text-white">
        <app-icon nombre="graduacion" clase="h-5 w-5" />
      </span>
      <span class="flex flex-col leading-tight">
        <span class="font-display text-base font-bold text-brand-900">Talento ITM</span>
        <span class="text-[11px] font-medium text-slate-500">Plataforma de talento</span>
      </span>
    </a>

    <!-- Navegación escritorio -->
    <nav class="hidden items-center gap-1 lg:flex">
      @for (enlace of enlacesVisibles(); track enlace.ruta) {
        <a
          routerLink="{{ enlace.ruta }}"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: enlace.ruta === '/inicio' }"
          class="enlace-nav"
        >
          <app-icon [nombre]="enlace.icono" clase="h-4 w-4" />
          {{ enlace.etiqueta }}
        </a>
      }
    </nav>

    <!-- Acciones -->
    <div class="flex items-center gap-2">
      <span
        class="hidden rounded-full bg-brand-50 px-3 py-1 text-xs font-semibold capitalize text-brand-700 ring-1 ring-brand-200 md:inline-flex"
      >
        {{ auth.rolActual() }}
      </span>
      <button appButton variante="secundario" tamano="sm" (click)="auth.logout()">
        <app-icon nombre="logout" clase="h-4 w-4" />
        <span class="hidden sm:inline">Salir</span>
      </button>

      <!-- Botón menú móvil -->
      <button
        class="flex h-9 w-9 items-center justify-center rounded-lg text-slate-600 hover:bg-slate-100 lg:hidden"
        (click)="alternarMenu()"
        [attr.aria-expanded]="menuAbierto()"
        aria-label="Abrir menú"
      >
        <app-icon nombre="menu" clase="h-5 w-5" />
      </button>
    </div>
  </div>

  <!-- Menú móvil -->
  @if (menuAbierto()) {
    <nav class="border-t border-slate-100 bg-white px-4 pb-4 pt-2 lg:hidden">
      @for (enlace of enlacesVisibles(); track enlace.ruta) {
        <a
          routerLink="{{ enlace.ruta }}"
          routerLinkActive="activo"
          (click)="menuAbierto.set(false)"
          class="flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-brand-50 hover:text-brand-800"
        >
          <app-icon [nombre]="enlace.icono" clase="h-4 w-4 text-slate-400" />
          {{ enlace.etiqueta }}
        </a>
      }
    </nav>
  }
</header>
